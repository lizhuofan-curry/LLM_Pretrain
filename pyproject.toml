[project]
name = "llm-pretrain"
version = "0.1.0"
description = "A learning-first LLM pretraining lab: from tokenization to scalable training systems."
readme = "README.md"
authors = [
    { name = "curry", email = "Lizhuofan@henu.edu.cn" }
]
requires-python = ">=3.11,<3.12"
dependencies = [
    "accelerate>=1.15.0",
    "datasets>=5.0.1",
    "datatrove>=0.10.0",
    "lm-eval>=0.4.13",
    "tiktoken>=0.14.0",
    "tokenizers>=0.23.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "wandb>=0.30.0",
]

[project.scripts]
llm-pretrain = "llm_pretrain:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
